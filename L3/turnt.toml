# Run both optimizers from the L3 directory: turnt --diff tests/lvn/*.bril
# Inspect TDCE's JSON: bril2json < tests/lvn/duplicate.bril | python3 -B tdce.py
[envs.tdce]
command = """bash -o pipefail -c 'bril2json | python3 -B tdce.py | brili "$@"' -- {args} < "{filename}""""

# Run the LVN-optimized programs and compare their output with the .out files.
#       turnt --diff -e lvn tests/lvn/*.bril
[envs.lvn]
command = """bash -o pipefail -c 'bril2json | python3 -B lvn.py | brili "$@"' -- {args} < "{filename}""""

# Run the original program with brili. Use --save to write its output to the .out file.
#       turnt -e expected-output --save tests/lvn/parameter.bril
# Check an existing snapshot with turnt -e expected-output tests/lvn/parameter.bril.
[envs.expected-output]
default = false
command = """bash -o pipefail -c 'bril2json | brili "$@"' -- {args} < "{filename}""""
