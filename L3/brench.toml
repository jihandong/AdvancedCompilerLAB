benchmarks = [
    "tests/lvn/*.bril",
    "../../cs6120/bril/benchmarks/core/*.bril",
]
extract = 'total_dyn_inst: (\d+)'
timeout = 30

[runs.baseline]
pipeline = ["bril2json", "DENO_V8_FLAGS=--stack-size=4096 brili -p {args}"]

[runs.example]
pipeline = [
    "bril2json",
    'python3 -B "$HOME/projects/cs6120/bril/examples/lvn.py"',
    "DENO_V8_FLAGS=--stack-size=4096 brili -p {args}",
]

[runs.lvn]
pipeline = ["bril2json", "PYTHONPATH=.. python3 -B lvn.py", "DENO_V8_FLAGS=--stack-size=4096 brili -p {args}"]

[runs.lvn_tdce]
pipeline = ["bril2json", "PYTHONPATH=.. python3 -B lvn_tdce.py", "DENO_V8_FLAGS=--stack-size=4096 brili -p {args}"]
